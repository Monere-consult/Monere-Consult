</head>

<body>

    <header class="header">

        <a href="../index.html#inicio" class="logo">
            <img src="../img/Monere Consult logo.svg" alt="Logo Monere Consult">

            <h1 class="titulo">
                <span class="titulo-azul">Monere</span>
                <span class="titulo-branco">Consult</span>
            </h1>
        </a>

        <div class="icone">

            <ul class="navibar">
                <li><a href="../index.html#inicio">Início</a></li>
                <li><a href="../index.html#sobre-nos">Sobre nós</a></li>
                <li><a href="../index.html#solucoes">Soluções</a></li>
                <li><a href="../index.html#simulador">Simulador</a></li>
                <li><a href="../index.html#equipe">Nossa equipe</a></li>
            </ul>

            <a href="../Tela de Login/tela_login.html" class="icone-login" data-tooltip="Login" aria-label="Login">
                <img src="../img/icone.svg" alt="">
            </a>

        </div>

    </header>

    <main>

        <div class="caixa-imagem">
            <img src="../Tela de Login/assets/img/foto-direito.png" alt="Monitoramento de temperatura para animais">
        </div>

        <div class="caixa-login">

            <div class="logo"><b>Monere</b> Consult</div>

            <h1>Faça seu cadastro!</h1>

            <form>

                <label for="ipt_email">Email:</label>

                <div class="campo">
                    <span>✉</span>
                    <input type="text" id="ipt_email" placeholder="Digite seu e-mail">
                </div>

                <div id="div_emailInvalido"></div>

                <label for="ipt_senha">Senha:</label>

                <div class="campo">
                    <input type="password" id="ipt_senha" placeholder="Crie uma senha">
                </div>

                <div id="div_forcaSenha"></div>

                <label for="ipt_confirmarSenha">Confirme sua senha:</label>

                <div class="campo">
                    <input type="password" id="ipt_confirmarSenha" placeholder="Digite a senha novamente">
                </div>

                <div id="div_camposInvalidos"></div>

                <button type="button" class="botao-cadastro" onclick="cadastrar()">Cadastre-se</button>

            </form>

        </div>

    </main>

</body>

</html>

<script>
    function cadastrar() {
        let email = ipt_email.value;
        let senha = ipt_senha.value;
        let confirmarSenha = ipt_confirmarSenha.value;

        let emailInvalido = true;
        let tem1arroba = false;
        let senhaInvalida = true;
        let cfmSenhaInvalido = true;

        let temMaius = false;
        let temMinus = false;
        let temNum = false;
        let temSimb = false;
        let numerosPermitidos = "0123456789";
        let simbolos = "!@#$%&*_-./";

        let contarCaractere = 0;


         // email
        if (!email.includes(" ") && email.split("@").length == 2 &&(
            email.endsWith("@gmail.com") ||
            email.endsWith("@hotmail.com") ||
            email.endsWith("@outlook.com") ||
            email.endsWith("@sptech.school")
        )) {
            emailInvalido = false;
        }

        while (contarCaractere < senha.length) {
            let caractere = senha[contarCaractere];
            if (caractere >= "A" && caractere <= "Z") temMaius = true;
            if (caractere >= "a" && caractere <= "z") temMinus = true;
            if (numerosPermitidos.includes(caractere)) temNum = true;
            if (simbolos.includes(caractere)) temSimb = true;
            contarCaractere++;
        }

        // senha
        if (temMaius && temMinus && temNum && temSimb && senha.length >= 8 && senha.length <= 45) {
            div_forcaSenha.innerHTML = "Forte";
            senhaInvalida = false;
        } else {
            div_forcaSenha.innerHTML = "Fraca";
            senhaInvalida = true;
        }

        // confirmar senha
        if (confirmarSenha === senha && senha !== "") {
            cfmSenhaInvalido = false;
            div_camposInvalidos.innerHTML = ""
        } else {
            div_camposInvalidos.innerHTML = "As senhas são diferentes.";
        }

        // mensagens
        if (emailInvalido) {
            div_emailInvalido.innerHTML = "Digite um email válido.";


        if (emailInvalido || senhaInvalida || cfmSenhaInvalido) {
                div_camposInvalidos.innerHTML = "Preencha  os dados corretamente."
            }

        }
    }
    
</script>
</body>

</html>
