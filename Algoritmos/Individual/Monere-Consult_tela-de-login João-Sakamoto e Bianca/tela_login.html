<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monere Consulting</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body">
    <header id="cabecalho">
        <div id="cabecalho_container">
            <a href="#" id="cabecalho_logo">
                <img src="assets/img/logo-monere.png" alt="Logo Monere">
                <span><strong>Monere</strong> Consulting</span>
            </a>
            <nav id="cabacalho_menu">
                <ul id="cabecalho_lista">
                    <li><a href="#" class="item-ativo">Início</a></li>
                    <li><a href="sobrenos.html">Sobre nós</a></li>
                    <li><a href="solucoes.html">Soluções</a></li>
                    <li><a href="simulador.html">Simulador</a></li>
                    <li><a href="#">Nossa equipe</a></li>
                </ul>
            </nav>
            <a href="" id="cabecalho_usuario">
                <img src="assets/img/Monere Consult (1).svg" alt="">
            </a>
        </div>
    </header>
    <main>

    <!-- Caixa da esquerda: imagem -->
    <div class="caixa-imagem">
      <img src="assets/img/foto-direito.png" alt="Monitoramento de temperatura para animais">
    </div>

    <!-- Caixa da direita: login -->
    <div class="caixa-login">
      <div class="logo"><b>Monere</b> Consulting</div>

      <h1>Faça seu login!</h1>

      <form>
        <label for="email">Email:</label>
        <div class="campo">
          <span>✉</span>
          <input type="email" id="email" required>
        </div>

        <label for="ipt_senha">Senha:</label>
        <div class="campo">
          <input type="password" id="ipt_senha" required>
        </div>

        <button type="submit" class="botao-cadastro">Login</button>
      </form>

      <p class="cadastro">Não tem uma conta? <a href="tela_cadastro.html">Cadastre-se</a></p>

    </div>

  </main>

</body>

</html>
