<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monere Consulting - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <div class="logo">
      <img src="logo-monere.png" alt="Logo Monere" class="logo-icone">
      <span><b>Monere</b> Consulting</span>
    </div>

    <nav class="menu">
      <a href="#">Início</a>
      <a href="#">Sobre nós</a>
      <a href="#">Soluções</a>
      <a href="#">Simulador</a>
      <a href="#">Nossa equipe</a>
      <span class="usuario">&#9679;</span>
    </nav>
  </header>

  <main class="conteudo">

    <section class="painel-esquerdo">
      <img src="foto-direito.png" alt="Monitoramento de temperatura">
    </section>

    <section class="painel-login">
      <div class="logo logo-login">
        <img src="logo-monere.png" alt="Logo Monere" class="logo-icone">
        <span><b>Monere</b> Consulting</span>
      </div>

      <h1>Bem vindo de volta!</h1>

      <form>
        <label for="email">Email:</label>
        <div class="campo">
          <span>&#9993;</span>
          <input type="email" id="email">
        </div>

        <label for="senha">Senha:</label>
        <div class="campo">
          <span>&#128274;</span>
          <input type="password" id="senha">
          <span>&#128065;</span>
        </div>

        <a href="#" class="esqueci">Esqueceu sua senha?</a>

        <button type="submit">Login</button>

        <p class="cadastro">Não tem uma conta? <a href="#">Cadastre-se</a></p>
      </form>
    </section>

  </main>

</body>
</html>
